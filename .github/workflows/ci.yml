name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run static sanity check
        run: |
          python -m py_compile backend/api/v1/analysis.py backend/services/scraper/wb_scraper.py

      - name: Run PDF export smoke test
        run: |
          python -m pytest -q backend/tests/test_export_endpoint.py
